services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:17
    container_name: funding_monitor_db
    environment:
      POSTGRES_DB: funding_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funding_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - funding_monitor

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: funding_monitor_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - funding_monitor

# ==================== Volumes ====================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

# ==================== Networks ====================
networks:
  funding_monitor:
    driver: bridge
